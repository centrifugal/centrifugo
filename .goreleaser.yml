version: 2

project_name: centrifugo
release:
  github:
    owner: centrifugal
    name: centrifugo
  name_template: '{{.Tag}}'
  prerelease: auto
  draft: true
  # A draft left by a failed release attempt is replaced when the job is re-run.
  replace_existing_draft: true
  extra_files:
    - glob: ./PACKAGES/*.deb
    - glob: ./PACKAGES/*.rpm
    - glob: ./PACKAGES/*.txt
brews:
  -
    # Pre-releases are not published to the Homebrew tap.
    skip_upload: auto
    repository:
      owner: centrifugal
      name: homebrew-centrifugo
    directory: Formula
    description: "Scalable real-time messaging server in a language-agnostic way"
    commit_author:
      name: Alexander Emelin
      email: frvzmb@gmail.com
    install: bin.install "centrifugo"
    homepage: "https://github.com/centrifugal/centrifugo"
builds:
- goos:
  - linux
  - darwin
  - freebsd
  - windows
  goarch:
  - amd64
  - arm
  - arm64
  ignore:
    - goos: darwin
      goarch: arm
    - goos: windows
      goarch: arm
    - goos: freebsd
      goarch: arm
    - goos: windows
      goarch: arm64
    - goos: freebsd
      goarch: arm64
  main: .
  # Module paths instead of build machine paths in stack traces and profiles.
  flags:
    - -trimpath
  ldflags: -s -w -X github.com/centrifugal/centrifugo/v6/internal/build.Version={{.Version}} -X github.com/centrifugal/centrifugo/v6/internal/build.UsageStatsEndpoint={{ .Env.STATS_ENDPOINT }} -X github.com/centrifugal/centrifugo/v6/internal/build.UsageStatsToken={{ .Env.STATS_TOKEN }} -X github.com/centrifugal/centrifugo/v6/internal/build.ReleaseTime={{ .Env.UNIX_NOW }}
  binary: centrifugo
  env:
    # https://github.com/goreleaser/goreleaser/issues/225
    - CGO_ENABLED=0
archives:
  - id: centrifugo
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [tar.gz]
    files:
    - LICENSE*
    - README*
    - CHANGELOG*
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  extra_files:
    - glob: ./PACKAGES/*.deb
    - glob: ./PACKAGES/*.rpm
dist: dist
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum
dockers:
  - ids:
      - centrifugo
    goos: linux
    goarch: amd64
    image_templates:
    - "centrifugo/centrifugo:{{ .Tag }}-amd64"
    - "{{ if not .Prerelease }}centrifugo/centrifugo:v{{ .Major }}-amd64{{ end }}"
    - "{{ if not .Prerelease }}centrifugo/centrifugo:v{{ .Major }}.{{ .Minor }}-amd64{{ end }}"
    - "{{ if not .Prerelease }}centrifugo/centrifugo:latest-amd64{{ end }}"
    use: buildx
    build_flag_templates:
    - "--pull"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--label=org.opencontainers.image.source={{.GitURL}}"
    - "--label=org.opencontainers.image.title=Centrifugo"
    - "--label=org.opencontainers.image.description=Scalable real-time messaging server"
    - "--label=org.opencontainers.image.url=https://centrifugal.dev"
    - "--label=org.opencontainers.image.licenses=Apache-2.0"
    - "--platform=linux/amd64"
  - ids:
      - centrifugo
    goos: linux
    goarch: arm64
    image_templates:
    - "centrifugo/centrifugo:{{ .Tag }}-arm64v8"
    - "{{ if not .Prerelease }}centrifugo/centrifugo:v{{ .Major }}-arm64v8{{ end }}"
    - "{{ if not .Prerelease }}centrifugo/centrifugo:v{{ .Major }}.{{ .Minor }}-arm64v8{{ end }}"
    - "{{ if not .Prerelease }}centrifugo/centrifugo:latest-arm64v8{{ end }}"
    use: buildx
    build_flag_templates:
    - "--pull"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--label=org.opencontainers.image.source={{.GitURL}}"
    - "--label=org.opencontainers.image.title=Centrifugo"
    - "--label=org.opencontainers.image.description=Scalable real-time messaging server"
    - "--label=org.opencontainers.image.url=https://centrifugal.dev"
    - "--label=org.opencontainers.image.licenses=Apache-2.0"
    - "--platform=linux/arm64/v8"
docker_manifests:
  # Floating tags (latest, vX, vX.Y) are not pushed for pre-releases (skip_push: auto).
  - name_template: centrifugo/centrifugo:{{ .Tag }}
    image_templates:
      - centrifugo/centrifugo:{{ .Tag }}-arm64v8
      - centrifugo/centrifugo:{{ .Tag }}-amd64
  - name_template: centrifugo/centrifugo:v{{ .Major }}
    skip_push: auto
    image_templates:
      - centrifugo/centrifugo:{{ .Tag }}-arm64v8
      - centrifugo/centrifugo:{{ .Tag }}-amd64
  - name_template: centrifugo/centrifugo:v{{ .Major }}.{{ .Minor }}
    skip_push: auto
    image_templates:
      - centrifugo/centrifugo:{{ .Tag }}-arm64v8
      - centrifugo/centrifugo:{{ .Tag }}-amd64
  - name_template: centrifugo/centrifugo:latest
    skip_push: auto
    image_templates:
      - centrifugo/centrifugo:{{ .Tag }}-arm64v8
      - centrifugo/centrifugo:{{ .Tag }}-amd64
